name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Auditoria de dependências de produção: BLOQUEANTE.
      # Com o Next.js 15.5.28 (e o PostCSS forçado para 8.5.31 via overrides)
      # não há vulnerabilidades conhecidas de nível alto ou crítico.
      # Qualquer nova vulnerabilidade desse nível passa a barrar o merge.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
